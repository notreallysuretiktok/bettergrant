# Publishes braveartinitiative.com from brave-art-initiative/06-website/site
# to GitHub Pages whenever that folder changes on main.

name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "brave-art-initiative/06-website/site/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: brave-art-initiative/06-website/site
      - id: deployment
        uses: actions/deploy-pages@v4
